<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>代码块一键复制，来自公众号@开关的txt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{padding:20px;max-width:900px;margin:0 auto;background:#f5f5f5}
h1{font-size:18px;margin-bottom:16px;color:#222}
textarea{width:100%;min-height:220px;padding:12px;font-size:14px;border:1px solid #ccc;border-radius:6px;resize:vertical;background:#fff}
.btns{margin:12px 0;display:flex;gap:8px;flex-wrap:wrap}
button{padding:8px 14px;border:none;border-radius:6px;background:#2563eb;color:#fff;font-size:14px;cursor:pointer}
button.secondary{background:#666}
button:active{opacity:0.85}
#result{margin-top:12px;width:100%;min-height:160px;padding:12px;border:1px solid #ccc;border-radius:6px;resize:vertical}
.tip{margin-top:8px;color:#22c55e;height:20px;font-size:13px}
</style>
</head>
<body>
<h1>代码块一键复制，来自公众号@开关的txt</h1>
<textarea id="input" placeholder="在此粘贴你的代码/文本内容"></textarea>
<div class="btns">
<button onclick="genNormal()">生成普通代码块</button>
<button onclick="genFold()">生成折叠代码块</button>
<button class="secondary" onclick="clearAll()">清空</button>
</div>
<textarea id="result" readonly placeholder="生成结果在这里"></textarea>
<div class="tip" id="tip"></div>

<script>
const input = document.getElementById('input')
const result = document.getElementById('result')
const tip = document.getElementById('tip')

function showTip(text){
  tip.textContent = text
  setTimeout(()=>tip.textContent='',1800)
}
async function copyText(txt){
  try{
    await navigator.clipboard.writeText(txt)
    showTip('✅ 复制成功')
  }catch(e){
    showTip('❌ 复制失败，请手动复制')
  }
}
//普通代码块
function genNormal(){
  const raw = input.value
  if(!raw.trim()){showTip('请输入内容');return}
  const out = '```\n'+raw+'\n```'
  result.value = out
  copyText(out)
}
//折叠代码块
function genFold(){
  const raw = input.value
  if(!raw.trim()){showTip('请输入内容');return}
  const out = `<details>
<summary>点击查看代码（一键复制）</summary>

\`\`\`
${raw}
\`\`\`

</details>`
  result.value = out
  copyText(out)
}
function clearAll(){
  input.value=''
  result.value=''
  tip.textContent=''
}
</script>
</body>
</html>
