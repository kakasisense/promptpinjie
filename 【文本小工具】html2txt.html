<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HTML转TXT（批量+保留格式）</title>
    <style>
        body { margin: 20px; font-family: Arial; }
        .box { margin: 15px 0; }
        textarea { width: 100%; height: 200px; padding: 10px; box-sizing: border-box; }
        button { padding: 8px 20px; margin-right: 10px; cursor: pointer; }
        #batchFiles { display: none; }
        .file-list { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>HTML转TXT工具（批量转换+保留格式）</h2>

    <div class="box">
        <!-- 单文件上传 -->
        <input type="file" id="fileInput" accept=".html,.htm">
        <!-- 批量上传 -->
        <label for="batchFiles" style="cursor: pointer; color: #0066cc;">批量选择文件</label>
        <input type="file" id="batchFiles" accept=".html,.htm" multiple>
        <div class="file-list" id="fileList">已选文件：0个</div>
        
        <button onclick="convertSingle()">转换当前内容</button>
        <button onclick="convertBatch()">批量转换文件</button>
        <button onclick="copy()">复制结果</button>
        <button onclick="downloadTxt()">下载TXT</button>
    </div>

    <div class="box">
        <textarea id="htmlInput" placeholder="粘贴HTML代码或上传文件"></textarea>
    </div>

    <div class="box">
        <textarea id="txtOutput" placeholder="转换结果"></textarea>
    </div>

    <script>
        let batchFileList = [];
        
        // 单文件上传
        document.getElementById('fileInput').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            readFile(file, (content) => {
                document.getElementById('htmlInput').value = content;
            });
        };
        
        // 批量文件选择
        document.getElementById('batchFiles').onchange = function(e) {
            batchFileList = Array.from(e.target.files);
            document.getElementById('fileList').textContent = `已选文件：${batchFileList.length}个（${batchFileList.map(f => f.name).join(', ')}）`;
        };
        
        // 读取文件内容
        function readFile(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                callback(event.target.result);
            };
            reader.readAsText(file);
        }
        
        // 核心转换逻辑
        function convertHtml(html) {
            const div = document.createElement('div');
            div.innerHTML = html;

            // 链接转Markdown
            div.querySelectorAll('a').forEach(link => {
                const href = link.getAttribute('href');
                const text = link.textContent.trim();
                if (href && text) link.replaceWith(document.createTextNode(`[${text}](${href})`));
            });

            // 保留段落换行
            div.querySelectorAll('p, div').forEach(p => {
                if (p.textContent.trim()) p.innerHTML += '\n\n';
            });
            div.querySelectorAll('br').forEach(br => br.replaceWith(document.createTextNode('\n')));

            // 清理格式
            let text = div.textContent;
            return text.replace(/\n+/g, '\n').replace(/^\s+|\s+$/gm, '');
        }
        
        // 转换当前输入内容
        function convertSingle() {
            const html = document.getElementById('htmlInput').value;
            if (!html) { alert('请输入HTML！'); return; }
            document.getElementById('txtOutput').value = convertHtml(html);
        }
        
        // 批量转换文件
        function convertBatch() {
            if (batchFileList.length === 0) { alert('请选择批量文件！'); return; }
            
            let allResults = '';
            let processed = 0;
            
            batchFileList.forEach(file => {
                readFile(file, (content) => {
                    const result = convertHtml(content);
                    allResults += `=== ${file.name} ===\n${result}\n\n`;
                    processed++;
                    
                    if (processed === batchFileList.length) {
                        document.getElementById('txtOutput').value = allResults;
                        alert(`批量转换完成！共处理${processed}个文件`);
                    }
                });
            });
        }
        
        // 复制结果
        function copy() {
            const output = document.getElementById('txtOutput');
            if (!output.value) { alert('无结果！'); return; }
            output.select();
            document.execCommand('copy');
            alert('复制成功！');
        }
        
        // 下载TXT文件
        function downloadTxt() {
            const output = document.getElementById('txtOutput');
            if (!output.value) { alert('无结果！'); return; }
            
            const blob = new Blob([output.value], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `html转txt_${new Date().getTime()}.txt`;
            a.click();
            URL.revokeObjectURL(a.href);
        }
    </script>
</body>
</html>
